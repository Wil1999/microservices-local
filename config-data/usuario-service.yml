spring:
  application:
    name: usuario-service
    zipkin: http://localhost:9411

server:
  #port: 8080
  port: ${PORT:${SERVER_PORT:0}}   # Usando eureka server

eureka:
  client:
    fetch-registry: true  #Se coloca true por que es cliente
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
    instance:
      #hostname: localhost
      instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}  # usando eureka server

      ## CONFIGURACION PARA CIRCUIT BREAKER
resilience4j.circuitbreaker:
    instances:
        carrosCB:
            registerHealthIndicator: true
            slidingWindowSize: 10
            permittedNumberOfCallsInHalfOpenState: 3
            slidingWindowType: TIME_BASED
            minimumNumberOfCalls: 4
            waitDurationInOpenState: 5s
            failureRateThreshold: 50
            eventConsumerBufferSize: 10
        motosCB:
            registerHealthIndicator: true
            slidingWindowSize: 10
            permittedNumberOfCallsInHalfOpenState: 3
            slidingWindowType: TIME_BASED
            minimumNumberOfCalls: 4
            waitDurationInOpenState: 5s
            failureRateThreshold: 50
            eventConsumerBufferSize: 10
        todosCB:
            registerHealthIndicator: true
            slidingWindowSize: 10
            permittedNumberOfCallsInHalfOpenState: 3
            slidingWindowType: TIME_BASED
            minimumNumberOfCalls: 4
            waitDurationInOpenState: 5s
            failureRateThreshold: 50
            eventConsumerBufferSize: 10
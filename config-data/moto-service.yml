spring:
  application:
    name: moto-service
    zipkin: http://localhost:9411

server:
  #port: 8083
  port: ${PORT:${SERVER_PORT:0}}   # Usando eureka server

eureka:
  client:
    fetch-registry: true  #Se coloca true por que es cliente
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
    instance:
      #hostname: localhost
      instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}